[build-system]
requires = ["setuptools==84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tugyt"
dynamic = ["version"]
description = "A focused YouTube downloader powered by yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ftnick" }]
dependencies = [
    "yt-dlp[default]==2026.8.19",
    "rich==15.0.0",
]

[project.scripts]
tugyt = "tugyt.tugyt:cli"

[tool.setuptools.packages.find]
include = ["tugyt*"]

[tool.setuptools.dynamic]
version = { attr = "tugyt.tugyt.__version__" }
